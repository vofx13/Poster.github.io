<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>Một trái tim gửi tặng</title>
    <style>
        html,
        body,
        #pageFrame {
            width: 100%;
            height: 100%;
            margin: 0;
            border: 0;
        }

        body {
            overflow: hidden;
            background: #000;
        }

        #pageFrame {
            display: block;
        }

        #backgroundMusic {
            display: none;
        }
    </style>
</head>
<body>
    <audio id="backgroundMusic" loop preload="auto">
        <source src="Choanhchutthoi.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    <iframe id="pageFrame" title="Trang quà tặng" allow="autoplay"></iframe>
    <script>
        const pageFrame = document.getElementById('pageFrame');
        let pageFrameLoaded = false;
        const routes = {
            home: 'home.html',
            gift: 'gift.html',
            flower: 'flower.html'
        };

        pageFrame.addEventListener('load', function() {
            pageFrameLoaded = true;
        });

        function routeFromHash() {
            const route = location.hash.slice(1);
            return Object.prototype.hasOwnProperty.call(routes, route) ? route : 'home';
        }

        function loadRoute(route, addHistoryEntry) {
            if (!Object.prototype.hasOwnProperty.call(routes, route)) {
                throw new Error(`Trang không hợp lệ: ${route}`);
            }

            if (addHistoryEntry) {
                history.pushState(null, '', `#${route}`);
            }

            if (pageFrameLoaded) {
                pageFrame.contentWindow.location.replace(routes[route]);
            } else {
                pageFrame.src = routes[route];
            }
        }

        window.navigateToPage = function(path) {
            const route = Object.keys(routes).find(key => routes[key] === path);
            if (route) loadRoute(route, true);
        };

        window.addEventListener('popstate', function() {
            loadRoute(routeFromHash(), false);
        });

        const audio = document.getElementById('backgroundMusic');
        const storedVolume = localStorage.getItem('musicVolume');
        const savedVolume = Number(storedVolume);
        const savedTime = Number(localStorage.getItem('musicTime'));

        audio.volume = storedVolume !== null && Number.isFinite(savedVolume)
            ? savedVolume
            : 0.7;
        if (Number.isFinite(savedTime) && savedTime > 0) {
            const restorePosition = function() {
                audio.currentTime = savedTime;
            };
            if (audio.readyState >= 1) {
                restorePosition();
            } else {
                audio.addEventListener('loadedmetadata', restorePosition, { once: true });
            }
        }

        audio.addEventListener('play', function() {
            localStorage.setItem('musicPlaying', 'true');
        });
        audio.addEventListener('pause', function() {
            localStorage.setItem('musicPlaying', 'false');
        });
        audio.addEventListener('volumechange', function() {
            localStorage.setItem('musicVolume', String(audio.volume));
        });
        window.setInterval(function() {
            if (!audio.paused) {
                localStorage.setItem('musicTime', String(audio.currentTime));
            }
        }, 2000);

        if (localStorage.getItem('musicPlaying') === 'true') {
            audio.play().catch(function(error) {
                console.info('Trình duyệt cần thao tác của người dùng để tiếp tục phát nhạc.', error);
            });
        }

        loadRoute(routeFromHash(), false);
    </script>
</body>
</html>
